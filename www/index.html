<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a2a">
<title>Historia de La Purísima</title>
<style>
:root{box-sizing:border-box;--bg:#efe6d3;--ink:#2b1d12;--card:#fbf6ea;--acc:#2f5d3f;--gold:#c9a24a;--paper:#fbf4e3;--mut:#6b5a47;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17120d;--ink:#eadfc9;--card:#241c14;--acc:#8fc79f;--paper:#2a2118;--mut:#a89883;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1f3a2a;color:#f3e7c9}
header button{background:none;border:0;color:inherit;font-size:24px;cursor:pointer}
header b{font-size:18px}
#v{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.pad{padding:16px;max-width:720px;margin:0 auto;width:100%}
.hero{display:flex;justify-content:center;padding:18px 0 8px}
.hero .cv{width:150px;height:210px;font-size:9px;border-radius:4px 10px 10px 4px;box-shadow:6px 8px 20px #0006}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mi{background:var(--card);border:1px solid #c9a24a66;border-radius:12px;padding:14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 2px 6px #0002}
.mi span{font-size:26px;display:block}.mi b{display:block;margin-top:4px}.mi small{color:var(--mut)}
.cv{width:100%;height:100%;background:linear-gradient(145deg,#24452f,#10241a);border:3px double var(--gold);color:#f3e7c9;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6%;font-size:clamp(11px,3.4vw,16px);box-shadow:inset 6px 0 12px #0008}
.cv svg{width:80%}.cv h1{font-size:2.1em;line-height:1.05;margin:.3em 0;color:var(--gold);font-variant:small-caps}
.cv p{margin:.2em 0;opacity:.9}.cv i{display:block;margin-top:1.2em;font-size:1.05em}.cv small{opacity:.7}
.bw{flex:1;min-height:0;display:flex;justify-content:center;padding:12px 10px;perspective:1800px;overflow:hidden}
#bk{position:relative;width:min(100%,480px);height:100%;touch-action:pan-y;user-select:none}
.lf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,.1,.2,1);filter:drop-shadow(-3px 3px 6px #0004)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px 8px 8px 2px;overflow:hidden}
.f{background:var(--paper);background-image:linear-gradient(90deg,#0003,transparent 7%)}
.b{background:var(--paper);transform:rotateY(180deg);background-image:linear-gradient(270deg,#0004,transparent 25%)}
.pp{height:100%;overflow:auto;padding:22px 22px 34px 28px;font-size:clamp(14px,3.9vw,17px)}
.pp h2{margin:0 0 8px;color:var(--acc);font-size:1.25em}.pp p{margin:.5em 0;text-align:justify;hyphens:auto}
.pp .n{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut)}
.pp a{display:block;padding:4px 0;border-bottom:1px dotted #8a6;cursor:pointer;color:var(--ink)}
.bar{display:flex;justify-content:center;align-items:center;gap:18px;padding:8px;color:var(--mut)}
.bar button{font-size:22px;background:var(--card);color:var(--ink);border:1px solid #c9a24a88;border-radius:50%;width:42px;height:42px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:6px 12px;border-radius:99px;border:1px solid var(--gold);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.c{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border-left:4px solid var(--gold);box-shadow:0 1px 4px #0002}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:#24452f;color:var(--gold);display:grid;place-items:center;font-weight:bold}
.c h3{margin:0;font-size:17px}.c em{color:var(--acc);font-size:13px;display:block}.c p{margin:.3em 0 0;font-size:15px}
.tl{border-left:2px solid var(--gold);margin-left:8px;padding-left:14px}.tl div{margin-bottom:12px}.tl b{color:var(--acc)}
h2.t{margin:4px 0 12px;color:var(--acc)}
.ci{width:100%;height:100%;object-fit:contain;display:block}
.gal{columns:2;gap:10px}.gal figure{margin:0 0 10px;break-inside:avoid;background:var(--card);border:1px solid #c9a24a66;border-radius:8px;overflow:hidden;cursor:pointer}
.gal img{width:100%;display:block}.gal figcaption{padding:6px 8px;font-size:12px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#lb{position:fixed;inset:0;background:#000d;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px;color:#f3e7c9;text-align:center}
#lb img{max-width:100%;max-height:62%;object-fit:contain;border-radius:4px}#lb p{max-width:520px;margin:0;font-size:15px}
#lb div{display:flex;gap:16px}#lb button{font-size:24px;background:#24452f;color:#f3e7c9;border:1px solid var(--gold);border-radius:50%;width:46px;height:46px}
#sp{position:fixed;inset:0;z-index:20;background:#1b3222;display:flex;align-items:center;justify-content:center;transition:opacity .25s}#sp img{max-width:100%;max-height:100%;object-fit:contain}
details.c{display:block;cursor:pointer}details.c summary{list-style:none;font-weight:bold;font-size:17px;display:flex;justify-content:space-between;gap:8px}details.c summary::-webkit-details-marker{display:none}details.c summary::after{content:"▾";color:var(--acc)}details.c[open] summary::after{content:"▴"}details.c p{margin:.6em 0 0;font-size:15px}
.pp h2.h1{font-size:1.1em}.pp a.l1{padding-left:16px;font-size:.95em}.pp a.l0{font-weight:bold}
button,summary,.c,.mi{touch-action:manipulation}.rd{padding:18px 20px 40px;max-width:720px;margin:0 auto;width:100%;font-size:18px;line-height:1.7}.rd h2{color:var(--acc);font-size:1.3em;line-height:1.3;margin:0 0 .6em}.rd h2.h1{font-size:1.15em}.rd p{margin:.75em 0;text-align:left}.rn{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:28px;color:var(--mut)}.rn button{padding:10px 14px;border-radius:99px;border:1px solid var(--gold);background:var(--card);color:var(--ink);font:inherit;font-size:15px}.rn button:disabled{opacity:.35}
details.c summary{display:block;font-weight:normal}details.c summary::after{content:none!important}.more{display:block;margin-top:.5em;color:var(--acc);font-size:14px;font-weight:bold}.more::before{content:"Leer anécdota ▾"}details[open] .more::before{content:"Cerrar ▴"}.ft{margin-top:.6em;border-top:1px dotted var(--gold);padding-top:.4em}.ft p{margin:.6em 0;font-size:16px;line-height:1.65;text-align:left}.mi b,.c h3{color:var(--acc)}@media(prefers-color-scheme:dark){.chips button.on{color:#10241a}}
</style></head><body>

<script>
const $=s=>document.querySelector(s),R=a=>a.map(x=>x.split('|'));
const CVS=$('#sp img').src;const covIn='<img class=ci src="'+CVS+'" alt="Portada">';const cov=`<div class=cv style="padding:0;display:block;background:#10241a;border:0">${covIn}</div>`;
const BI=R(['Vicente Terrazas|Tatarabuelo del autor|1820–1868|Nació en Tarjeas, Celaya. Casado con Bartola Salinas, vivió en Ajuchitlancito como vaquero de hacienda. Murió herido por un bandido que quería robar el ganado.|F',
'Bartola Salinas|Tatarabuela|c. 1822|De Huimilpan. Guardaba monedas de oro en tinajas y tenía mucho ganado; pudo comprar una hacienda por 10,000 pesos oro, pero prefirió no gastar.|F',
'Alfonso Terrazas Salinas|Bisabuelo, músico y poeta|† 1947|Tocaba el violín, hablaba en refranes y lo contrataban para pedir novias. Encabezó la defensa familiar contra Tinajero. Murió a los 105 años.|F',
'Ana Cleta Sánchez|Bisabuela|† a los 86|De La Cuesta, Huimilpan, muy católica. Alfonso la cruzó cargada por el río crecido para llevarla a casa. Madre de Herculano.|F',
'Víctor Terrazas Salinas|Tío abuelo|—|Decidido y explosivo. Venció a dos asaltantes en el camino real y dio con el asesino de su padre Vicente.|F',
'Estefana Terrazas Sánchez|Tía abuela|—|Los bandidos la ataron con una soga para sacarle el secreto del dinero; ella fingía ahogarse mientras la soga ni se tensaba.|F',
'Herculano Terrazas Sánchez|Abuelo paterno y primer poblador|n. 1895|Llegó el 20 de mayo de 1947 al Potrero con su familia. La puerta de su primera casa, hecha en 1938, aún se conserva.|P',
'Ana Espinoza Barrón|Abuela paterna|—|De Carranza, Huimilpan. Al perder a un hijo dijo que Dios se encargaría del culpable: “siempre será mejor la paz”.|F',
'Antonio Terrazas Espinoza|Fundador, tío del autor|1922–2017|Nació y murió un 6 de enero, a los 95 años. La calle principal de la comunidad lleva su nombre. Esposo de Celerina Flores Zamudio.|P',
'Agustín Terrazas Espinoza|Padre del autor|—|Primer subdelegado con credencial (1968), instaló el molino de nixtamal y compró el primer tractor. Soñaba con ser militar. Se casó a los 19 años.|P',
'María Luisa León Morales|Madre del autor|—|Se casó a los 15 años y tuvo doce hijos. Atendía una tienda bien surtida y traía mercancía de Querétaro en burro.|F',
'María Concepción Morales Lara|Abuela materna|† 1982|Luchona y comerciante. El 8 de diciembre de 1967 propuso el nombre “La Purísima Concepción”. Perdió a su esposo y a su hijo Isidro.|P',
'Macedonio León Maya|Abuelo materno|† c. 1935|Reclutado por la leva en 1915, domó caballos para el ejército. Agrarista, recibió tierra; fue secuestrado y murió torturado.|F',
'Benito Bocanegra Osornio|Personaje ilustre|1903–1955|Organizó ejidos en Huimilpan y San Cirilo; fue presidente municipal de Pedro Escobedo (1943–1946). Asesinado el 1 de noviembre de 1955.|H',
'José Morales Sánchez|Primer subdelegado|—|El de más edad entre los fundadores (unos 65 años); sabía leer y escribir. Su huerto aportó terreno para la capilla.|P',
'José Carmen Tovar Flores|Memoria histórica|—|Llegó a los 9 años. Sus recuerdos fueron fuente clave del libro, como los “cuicillos” de piedra hallados en su terreno.|P',
'Fraile Aparicio|Franciscano|siglo XIX|Vivió en una choza en el Potrero y cuidó a soldados de ambos bandos; el lugar tomó su nombre.|H',
'Teniente Pancracio|Oficial carrancista|1915|Reclutó a Macedonio pero lo liberó para que volviera a cultivar la tierra.|H',
