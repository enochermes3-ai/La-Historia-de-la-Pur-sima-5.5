name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore purisima-release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias purisima \
            -storepass "CambiaEstaClave123!" \
            -keypass "CambiaEstaClave123!" \
            -dname "CN=Historia de la Purisima, OU=App, O=Proyecto, L=Mexico, S=Mexico, C=MX"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: purisima-keystore
          path: purisima-release-key.jks
